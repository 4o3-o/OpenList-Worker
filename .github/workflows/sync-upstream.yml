name: Sync OpenList upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-openlist-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fast-forward main from upstream
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          FORK_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Configure the UPSTREAM_SYNC_TOKEN repository secret with Contents and Workflows write permissions."
            exit 1
          fi
          gh repo sync "$FORK_REPOSITORY" --source OpenListTeam/OpenList-Worker --branch main
